# Ultralytics YOLOv8-seg instance segmentation model with P2/4 - P5/32 outputs, medium scale
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/segment

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768] # <-- Using these parameters
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0m backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0m head (通道数调整)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  # --- P3 -> P2 (NEW BLOCK) ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 3, C2f, [128]] # 18 (P2/4-xsmall) (128 -> 96, 3 -> 2)

  # --- P2 -> P3 (Downsample for P3 output) ---
  - [-1, 1, Conv, [256, 3, 2]] # (256 -> 192)
  - [[-1, 15], 1, Concat, [1]] # cat head P3
  - [-1, 3, C2f, [256]] # 21 (P3/8-small) (256 -> 192, 3 -> 2)

  # --- P3 -> P4 (Downsample for P4 output) ---
  - [-1, 1, Conv, [512, 3, 2]] # (512 -> 384)
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 24 (P4/16-medium) (512 -> 384, 3 -> 2)

  # --- P4 -> P5 (Downsample for P5 output) ---
  - [-1, 1, Conv, [1024, 3, 2]] # (1024 -> 576)
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 27 (P5/32-large) (1024 -> 576, 3 -> 2)

  # --- Segmentation Output ---
  # P2/4, P3/8, P4/16, P5/32 四个尺度的特征图
  - [[18, 21, 24, 27], 1, Segment, [nc, 32, 256]] # Segment(P2, P3, P4, P5)

